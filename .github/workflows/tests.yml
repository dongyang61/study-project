name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: LLM/agent/two/xAgent/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r LLM/agent/two/xAgent/requirements.txt
      - name: Compile
        run: |
          python -m compileall -q \
            LLM/agent/two/xAgent \
            LLM/anytingLLM-MCP \
            LLM/agent/office/pethospital-mcp
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate skills
        run: python LLM/agent/two/xAgent/scripts/validate_skills.py --root LLM/agent/office

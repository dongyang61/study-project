# 复制为 config.ini 后填写真实值；config.ini 已被 .gitignore 忽略，不要提交。
[llm]
base_url = https://api.deepseek.com/v1
api_key = your-api-key-here
model = deepseek-chat
# 可选：模型上下文窗口，默认 65536
context_window = 65536

[search]
# 百度千帆联网搜索 API Key；留空时 searchWeb 返回明确的配置错误
baidu_qianfan_api_key = your-baidu-qianfan-api-key

[agent]
# 启动工作目录下的长期规则文件；不存在时兼容 AGENTS.md
agent_file = AGENT.md
agent_file_enabled = true
agent_file_max_chars = 8000
# true 时允许文件工具修改工作目录之外的文件（风险自负，默认 false）
workspace_allow_outside = false
# 单轮最多模型请求步数
max_steps = 20
# 单轮总超时（秒）
turn_timeout = 300
# loadSkill 单次读取上限（字符）
skill_max_chars = 50000
